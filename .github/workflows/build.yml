name: Build

on:
  push:
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Windows LibRaw toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libraw
      - name: Configure Windows cgo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=g++" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=C:/msys64/ucrt64/lib/pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test
        run: go test ./...
      - name: Test LibRaw integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/libraw-env.ps1
          Set-LibRawBuildEnv "Windows CI tests use embedded LibRaw."
          go test -tags=libraw ./internal/preview
      - name: Build
        if: runner.os != 'Windows'
        run: |
          mkdir -p bin
          go build -o bin/PhotoChoser ./cmd/photochoser
      - name: Build Windows GUI exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: photochoser-macos-ci
          path: bin/PhotoChoser
          if-no-files-found: error
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: photochoser-windows-ci
          path: bin/PhotoChoser.exe
          if-no-files-found: error
